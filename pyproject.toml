[project]
name = "open-book-builder"
version = "0.2.0"
description = "Desktop viewer for the Open Book e-reader hardware: parts list, assembly guide, board and case views."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "numpy>=1.26", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
open-book-builder = "open_book_builder.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_book_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
